<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>룰렛 추첨 결과</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif;
        --ink: light-dark(#18201d, #f4f7f5);
        --muted: light-dark(#617069, #aebbb4);
        --surface: light-dark(#fbfaf5, #17201d);
        --surface-soft: light-dark(#f0eee4, #202c28);
        --line: light-dark(#d9d8ce, #394740);
        --accent: #ff6b35;
        --accent-2: #f4c95d;
        --accent-3: #2c8c6d;
        --shadow: 0 16px 40px color-mix(in srgb, #07110d 18%, transparent);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: transparent;
        color: var(--ink);
      }

      .roulette-app {
        position: relative;
        display: grid;
        grid-template-columns: minmax(150px, 0.72fr) minmax(180px, 1.28fr);
        gap: clamp(18px, 5vw, 42px);
        min-height: 320px;
        padding: clamp(20px, 5vw, 38px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 26px;
        background:
          radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--accent-2) 24%, transparent), transparent 35%),
          radial-gradient(circle at 90% 100%, color-mix(in srgb, var(--accent-3) 18%, transparent), transparent 38%),
          var(--surface);
        box-shadow: var(--shadow);
      }

      .roulette-app::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(115deg, transparent 20%, color-mix(in srgb, white 16%, transparent) 50%, transparent 80%);
        content: "";
        transform: translateX(-100%);
      }

      .roulette-app.is-complete::after {
        animation: sheen 850ms ease-out;
      }

      .wheel-column {
        display: grid;
        place-items: center;
        align-content: center;
      }

      .wheel-wrap {
        position: relative;
        width: min(46vw, 190px);
        aspect-ratio: 1;
      }

      .pointer {
        position: absolute;
        z-index: 2;
        top: -8px;
        left: 50%;
        width: 26px;
        height: 32px;
        background: var(--ink);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        filter: drop-shadow(0 4px 3px color-mix(in srgb, #07110d 30%, transparent));
        transform: translateX(-50%);
      }

      .wheel {
        position: absolute;
        inset: 5%;
        display: grid;
        place-items: center;
        border: 8px solid var(--surface);
        border-radius: 50%;
        background: conic-gradient(
          from -8deg,
          var(--accent) 0deg 45deg,
          var(--accent-2) 45deg 90deg,
          var(--accent-3) 90deg 135deg,
          #5b6fdb 135deg 180deg,
          var(--accent) 180deg 225deg,
          var(--accent-2) 225deg 270deg,
          var(--accent-3) 270deg 315deg,
          #5b6fdb 315deg 360deg
        );
        box-shadow:
          0 0 0 1px var(--line),
          0 14px 26px color-mix(in srgb, #07110d 25%, transparent);
      }

      .wheel::after {
        width: 30%;
        aspect-ratio: 1;
        border: 5px solid var(--surface);
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 0 0 0 1px var(--line);
        content: "";
      }

      .wheel.is-spinning {
        animation: spin 1.45s cubic-bezier(0.16, 0.74, 0.22, 1) both;
      }

      .wheel.is-complete {
        transform: rotate(1160deg);
      }

      .result-column {
        position: relative;
        z-index: 1;
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 2.3rem);
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      .summary {
        margin: 10px 0 20px;
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.5;
      }

      .results {
        display: grid;
        gap: 8px;
        max-height: 255px;
        margin: 0;
        padding: 0 4px 0 0;
        overflow: auto;
        list-style: none;
        scrollbar-color: var(--line) transparent;
      }

      .result-item {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--surface-soft) 88%, transparent);
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        transition: opacity 260ms ease, transform 360ms cubic-bezier(0.2, 0.78, 0.24, 1);
      }

      .result-item.is-visible {
        opacity: 1;
        transform: none;
      }

      .result-order {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: var(--surface);
        font-size: 0.8rem;
        font-weight: 800;
      }

      .result-name {
        overflow: hidden;
        font-size: 1rem;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .has-error .eyebrow,
      .has-error h1 {
        color: #d4483f;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(1160deg); }
      }

      @keyframes sheen {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }

      @media (max-width: 520px) {
        .roulette-app {
          grid-template-columns: 1fr;
          min-height: 0;
        }

        .wheel-wrap {
          width: min(46vw, 150px);
        }

        .result-column {
          text-align: center;
        }

        .results {
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="roulette-app" data-stage>
      <section class="wheel-column" aria-hidden="true">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <div class="wheel" data-wheel></div>
        </div>
      </section>
      <section class="result-column" aria-live="polite" aria-atomic="false">
        <p class="eyebrow">Roulette draw</p>
        <h1 data-status>결과를 기다리는 중</h1>
        <p class="summary" data-summary>서버에서 추첨 결과를 확정하고 있습니다.</p>
        <ol class="results" data-results aria-label="당첨 결과"></ol>
      </section>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
